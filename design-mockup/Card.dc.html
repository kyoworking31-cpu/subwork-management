<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --border: #E4DDD0;
      --text-primary: #2B2723;
      --text-secondary: #7A7367;
      --text-tertiary: #A79F8F;
      --accent: #3E7C74;
      --accent-tint: #E4EFED;
      --accent-dark: #2E5B55;
      --cw-bg: #E8EEFB; --cw-text: #35548F;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; color: var(--text-primary); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-dark); text-decoration: underline; }
    .heading { font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; }
    .row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    .label { width: 108px; flex-shrink: 0; font-size: 12px; color: var(--text-tertiary); padding-top: 2px; }
    .value { font-size: 14px; color: var(--text-primary); line-height: 1.5; }
    .icon { color: var(--text-secondary); flex-shrink: 0; margin-top: 1px; }
  </style>
</helmet>

<div style="width:440px; min-height:820px; background:var(--surface); border-radius:14px; box-shadow:0 8px 28px rgba(43,39,35,0.08); display:flex; flex-direction:column; overflow:hidden;">

  <!-- Header -->
  <div style="padding:22px 24px 18px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="background:var(--cw-bg); color:var(--cw-text); font-size:12px; font-weight:600; padding:4px 10px; border-radius:6px;">CrowdWorks</span>
      <span style="display:flex; align-items:center; gap:6px; background:var(--accent-tint); color:var(--accent-dark); font-size:12px; font-weight:600; padding:4px 10px; border-radius:6px;">
        <span style="width:6px; height:6px; border-radius:50%; background:var(--accent-dark); display:inline-block;"></span>
        進行中
      </span>
    </div>
    <div class="heading" style="font-size:20px; font-weight:700;">議事録作成</div>
  </div>

  <!-- Fields -->
  <div style="padding:6px 24px 0;">
    <div class="row">
      <div class="label">クライアント</div>
      <div class="value">□□PMO<br><span style="color:var(--text-tertiary); font-size:12px;">pmo-tanto@example.com</span></div>
    </div>
    <div class="row">
      <div class="label">応募日</div>
      <div class="value">2026/08/18</div>
    </div>
    <div class="row">
      <div class="label">面談日時</div>
      <div class="value">2026/08/20 15:00</div>
    </div>
    <div class="row">
      <div class="label">納期</div>
      <div class="value" style="font-weight:600;">2026/09/10</div>
    </div>
    <div class="row">
      <div class="label">報酬額</div>
      <div class="value" style="font-weight:700; color:var(--accent-dark); font-size:16px;">¥25,000</div>
    </div>
    <div class="row" style="flex-direction:column; gap:6px;">
      <div class="label">メモ</div>
      <div class="value" style="background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; font-size:13px; line-height:1.7; color:var(--text-secondary);">
        週次ミーティング×4回分の議事録作成。録音データはクライアントから都度共有される予定。テンプレートは先方指定フォーマットを使用。
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div style="margin-top:auto; padding:18px 24px 22px;">
    <a href="#" style="display:flex; align-items:center; justify-content:center; gap:8px; background:var(--accent); color:#fff; border-radius:8px; padding:12px; font-size:14px; font-weight:600;">
      <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 10.5 15 3M15 3h-4.5M15 3v4.5"/><path d="M11 4.5H4.5A1.5 1.5 0 0 0 3 6v7.5A1.5 1.5 0 0 0 4.5 15H12a1.5 1.5 0 0 0 1.5-1.5V9.5"/></svg>
      案件ページを開く
    </a>
  </div>

</div>
</x-dc>
</body>
</html>
